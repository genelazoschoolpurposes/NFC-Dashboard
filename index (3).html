<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Dashboard</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#14161f;--muted:#6b7080;--accent:#4f46e5;--now:#e0e7ff;--line:#e3e5ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#1a1d27;--text:#eef0f6;--muted:#9aa0b4;--accent:#818cf8;--now:#272b4a;--line:#2a2e3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1d27;--text:#eef0f6;--muted:#9aa0b4;--accent:#818cf8;--now:#272b4a;--line:#2a2e3d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.wrap{max-width:520px;margin:0 auto;display:grid;gap:14px}
.card{background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--line)}
h2{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#time{font-size:clamp(40px,14vw,64px);font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
#date{color:var(--muted);margin-top:4px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;border-bottom:1px solid var(--line)}
li.now{background:var(--now);border-color:transparent}
li.done{opacity:.45}
.t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:96px}
.n{flex:1}
.tag{font-size:11px;color:var(--accent);font-weight:700}
button,input{font:inherit}
button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
button.x{background:none;color:var(--muted);padding:4px 8px}
form,.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
input{padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0}
input.title{flex:1 1 140px}
iframe{width:100%;border:0;border-radius:12px;height:352px}
a{color:var(--accent)}
.empty{color:var(--muted);padding:8px}
.soc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.soc a{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;color:#fff;text-decoration:none;font-weight:600}
.soc .fb{background:#1877f2}.soc .tt{background:#111;border:1px solid #444}.soc .ig{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af)}
.soc b{font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="time">--:--:--</div>
    <div id="date"></div>
  </div>

  <div class="card">
    <h2>Today's Schedule</h2>
    <ul id="list"></ul>
    <form id="add">
      <input type="time" id="s" required>
      <input type="time" id="e" required>
      <input class="title" id="n" placeholder="Class / activity" required>
      <button type="submit">Add</button>
    </form>
  </div>

  <div class="card">
    <h2>Music</h2>
    <div id="player"></div>
    <div class="row">
      <input class="title" id="pl" placeholder="Paste a Spotify playlist link">
      <button id="setpl" type="button">Set</button>
    </div>
    <p style="font-size:12px;color:var(--muted);margin:8px 0 0">If the player doesn't load, <a id="open" href="#" target="_blank" rel="noopener">open it in Spotify</a>.</p>
  </div>
  <div class="card">
    <h2>My Socials</h2>
    <div class="soc" id="soc"></div>
  </div>
</div>

<script>
var TZ="Asia/Manila";
var DEFAULT=[
  {s:"08:00",e:"09:30",n:"Networking 1"},
  {s:"10:00",e:"11:30",n:"Event-Driven Programming"},
  {s:"13:00",e:"14:30",n:"Group project work"},
  {s:"19:00",e:"20:00",n:"Study / review"}
];
var DEFAULT_PL="https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M";

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var items=load("dash_sched",DEFAULT);
var playlist=load("dash_pl",DEFAULT_PL);

function nowParts(){
  var f=new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  var p={};f.formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});
  var h=p.hour==="24"?"00":p.hour;
  return {h:h,m:p.minute,s:p.second,mins:parseInt(h,10)*60+parseInt(p.minute,10)};
}
function toMin(t){var a=t.split(":");return parseInt(a[0],10)*60+parseInt(a[1],10)}
function fmt12(t){var a=t.split(":"),h=parseInt(a[0],10),ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+a[1]+" "+ap}

function tick(){
  var n=nowParts(),h=parseInt(n.h,10),ap=h>=12?"PM":"AM";
  document.getElementById("time").textContent=(h%12||12)+":"+n.m+":"+n.s+" "+ap;
  document.getElementById("date").textContent=new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(new Date())+" · PHT";
  if(n.s==="00"||!tick.last){render()}
  tick.last=1;
}

function render(){
  var ul=document.getElementById("list"),m=nowParts().mins;
  items.sort(function(a,b){return toMin(a.s)-toMin(b.s)});
  ul.innerHTML="";
  if(!items.length){ul.innerHTML='<li class="empty">No activities yet. Add one below.</li>';return}
  var nextMarked=false;
  items.forEach(function(it,i){
    var s=toMin(it.s),e=toMin(it.e),li=document.createElement("li"),tag="";
    if(m>=s&&m<e){li.className="now";tag="NOW"}
    else if(m>=e){li.className="done"}
    else if(!nextMarked){nextMarked=true;tag="UP NEXT"}
    li.innerHTML='<span class="t">'+fmt12(it.s)+' – '+fmt12(it.e)+'</span><span class="n"></span><span class="tag">'+tag+'</span>';
    li.querySelector(".n").textContent=it.n;
    var b=document.createElement("button");b.className="x";b.textContent="✕";b.setAttribute("aria-label","Delete");
    b.onclick=function(){items.splice(i,1);save("dash_sched",items);render()};
    li.appendChild(b);ul.appendChild(li);
  });
}

document.getElementById("add").onsubmit=function(ev){
  ev.preventDefault();
  items.push({s:document.getElementById("s").value,e:document.getElementById("e").value,n:document.getElementById("n").value.trim()});
  save("dash_sched",items);this.reset();render();
};

function spotifyEmbed(url){
  var m=url.match(/open\.spotify\.com\/(playlist|album|track|artist|show|episode)\/([A-Za-z0-9]+)/);
  return m?"https://open.spotify.com/embed/"+m[1]+"/"+m[2]:null;
}
function showPlayer(){
  var src=spotifyEmbed(playlist)||spotifyEmbed(DEFAULT_PL);
  document.getElementById("player").innerHTML='<iframe src="'+src+'" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" title="Spotify player"></iframe>';
  document.getElementById("open").href=playlist;
}
document.getElementById("setpl").onclick=function(){
  var v=document.getElementById("pl").value.trim();
  if(spotifyEmbed(v)){playlist=v;save("dash_pl",v);showPlayer()}else{alert("Please paste a valid Spotify link.")}
};

var SOCIALS=[
  {cls:"fb",icon:"f",name:"Facebook",url:"https://www.facebook.com/yourusername"},
  {cls:"tt",icon:"♪",name:"TikTok",url:"https://www.tiktok.com/@yourusername"},
  {cls:"ig",icon:"◎",name:"Instagram",url:"https://www.instagram.com/yourusername"}
];
function showSocials(){
  var box=document.getElementById("soc");
  SOCIALS.forEach(function(x){
    if(!x.url)return;
    var a=document.createElement("a");
    a.className=x.cls;a.href=x.url;a.target="_blank";a.rel="noopener";
    a.innerHTML="<b>"+x.icon+"</b><span>"+x.name+"</span>";
    box.appendChild(a);
  });
  if(!box.children.length)box.parentNode.style.display="none";
}
showSocials();
showPlayer();tick();setInterval(tick,1000);
</script>
</body>
</html>
