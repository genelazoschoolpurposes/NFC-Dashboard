<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFC Link Maker</title>
<style>body{font-family:system-ui,sans-serif;max-width:480px;margin:0 auto;padding:16px}
label{display:block;margin-top:12px;font-weight:600;font-size:14px}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit}
button{margin-top:16px;padding:10px 16px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font:inherit}
#out{word-break:break-all;background:#f1f1f6;padding:12px;border-radius:8px;margin-top:16px}
small{color:#666}</style></head><body>
<h2>NFC Link Maker</h2>
<label>Dashboard base link<input id="base" value="https://genelazoschoolpurposes.github.io/NFC-Dashboard/"></label>
<label>Customer name<input id="name" placeholder="Juan"></label>
<label>Facebook (username or link)<input id="fb"></label>
<label>TikTok (username or link)<input id="tt"></label>
<label>Instagram (username or link)<input id="ig"></label>
<label>Spotify playlist link (optional)<input id="pl"></label>
<button id="go">Make link</button> <button id="cp">Copy</button>
<div id="out">Your link will appear here.</div>
<small>Paste this link into NFC Tools → Write → Add a record → URL.</small>
<script>
function $(i){return document.getElementById(i)}
$("go").onclick=function(){
  var p=new URLSearchParams();
  ["name","fb","tt","ig","pl"].forEach(function(k){var v=$(k).value.trim();if(v)p.set(k,v)});
  var base=$("base").value.trim().split("?")[0];
  $("out").textContent=base+(p.toString()?"?"+p.toString():"");
};
$("cp").onclick=function(){try{navigator.clipboard.writeText($("out").textContent)}catch(e){}};
</script></body></html>
